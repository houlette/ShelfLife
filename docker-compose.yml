services:
  api:
    # Fixed name so the shared Caddy (in ~/infra/) can reverse_proxy to
    # us by container name over the external `web` network.
    container_name: shelflife-api
    build: .
    restart: unless-stopped
    volumes:
      - /data/shelflife:/data
    environment:
      - DATABASE_URL=/data/shelflife.db
      - SHELFLIFE_SECRET_KEY=${SHELFLIFE_SECRET_KEY}
      - SHELFLIFE_BOOTSTRAP_EMAIL=${SHELFLIFE_BOOTSTRAP_EMAIL}
      - SHELFLIFE_BOOTSTRAP_PASSWORD=${SHELFLIFE_BOOTSTRAP_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - web

# Shared bridge network with the Caddy container in ~/infra/. Created
# once outside of compose with `docker network create web` — see the
# infra repo README.
networks:
  web:
    external: true
    name: web
